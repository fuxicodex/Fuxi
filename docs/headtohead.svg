  <text x="630" y="169" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">✓ 4/4</text>
  <line x1="40" y1="186" x2="740" y2="186" stroke="#f3f4f6" stroke-width="1"/>

  <!-- Row 3: total -->
  <rect x="40" y="186" width="700" height="44" fill="#ffffff"/>
