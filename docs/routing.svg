<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0a6fe7"/>
    </marker>
  </defs>

  <!-- Request -->
  <rect x="300" y="20" width="160" height="48" rx="10" fill="#0a6fe7"/>
  <text x="380" y="49" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Request</text>

  <!-- Router -->
  <rect x="290" y="100" width="180" height="60" rx="10" fill="#eef6ff" stroke="#0a6fe7" stroke-width="2"/>
  <text x="380" y="126" font-size="15" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Smart Router</text>
  <text x="380" y="146" font-size="11" fill="#374151" text-anchor="middle">scores complexity</text>

  <!-- Arrow request->router -->
  <line x1="380" y1="68" x2="380" y2="98" stroke="#0a6fe7" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Tier boxes -->
  <rect x="60" y="200" width="160" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="140" y="218" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Cheap model</text>
  <text x="140" y="234" font-size="10" fill="#6b7280" text-anchor="middle">simple tasks</text>

  <rect x="300" y="200" width="160" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="380" y="218" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Mid model</text>
  <text x="380" y="234" font-size="10" fill="#6b7280" text-anchor="middle">everyday tasks</text>

  <rect x="540" y="200" width="160" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="620" y="218" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Top model</text>
  <text x="620" y="234" font-size="10" fill="#6b7280" text-anchor="middle">hard tasks</text>

  <!-- Arrows router->tiers -->
  <line x1="340" y1="160" x2="150" y2="198" stroke="#0a6fe7" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="380" y1="160" x2="380" y2="198" stroke="#0a6fe7" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="420" y1="160" x2="610" y2="198" stroke="#0a6fe7" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="380" y="256" font-size="11" fill="#6b7280" text-anchor="middle">automatic failover + primary-vs-fallback racing</text>
</svg>
