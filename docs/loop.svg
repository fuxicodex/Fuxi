<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0a6fe7"/>
    </marker>
  </defs>

  <!-- Think -->
  <rect x="40" y="60" width="180" height="80" rx="12" fill="#eef6ff" stroke="#0a6fe7" stroke-width="2"/>
  <text x="130" y="92" font-size="20" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Think</text>
  <text x="130" y="116" font-size="12" fill="#374151" text-anchor="middle">Reason about the task</text>

  <!-- Act -->
  <rect x="290" y="60" width="180" height="80" rx="12" fill="#eef6ff" stroke="#0a6fe7" stroke-width="2"/>
  <text x="380" y="92" font-size="20" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Act</text>
  <text x="380" y="116" font-size="12" fill="#374151" text-anchor="middle">Edit files · run commands</text>

  <!-- Verify -->
  <rect x="540" y="60" width="180" height="80" rx="12" fill="#eef6ff" stroke="#0a6fe7" stroke-width="2"/>
  <text x="630" y="92" font-size="20" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Verify</text>
  <text x="630" y="116" font-size="12" fill="#374151" text-anchor="middle">Run tests · inspect</text>

  <!-- Forward arrows -->
  <line x1="220" y1="100" x2="286" y2="100" stroke="#0a6fe7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="100" x2="536" y2="100" stroke="#0a6fe7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop-back arrow -->
  <path d="M630,140 C630,175 130,175 130,144" fill="none" stroke="#0a6fe7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="190" font-size="13" fill="#374151" text-anchor="middle">iterate until the work is verified</text>
</svg>
