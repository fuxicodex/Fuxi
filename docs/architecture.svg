<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Core binary -->
  <rect x="300" y="120" width="160" height="60" rx="12" fill="#0a6fe7"/>
  <text x="380" y="147" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">FuXi</text>
  <text x="380" y="167" font-size="10" fill="#dbeafe" text-anchor="middle">one static binary · Go</text>

  <!-- Capability cards (top) -->
  <rect x="40" y="20" width="140" height="60" rx="8" fill="#eef6ff" stroke="#0a6fe7" stroke-width="1.5"/>
  <text x="110" y="45" font-size="13" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Read code</text>
  <text x="110" y="62" font-size="10" fill="#374151" text-anchor="middle">files · LSP · ripgrep</text>

  <rect x="200" y="20" width="140" height="60" rx="8" fill="#eef6ff" stroke="#0a6fe7" stroke-width="1.5"/>
  <text x="270" y="45" font-size="13" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Edit files</text>
  <text x="270" y="62" font-size="10" fill="#374151" text-anchor="middle">write · diff · patch</text>

  <rect x="360" y="20" width="140" height="60" rx="8" fill="#eef6ff" stroke="#0a6fe7" stroke-width="1.5"/>
  <text x="430" y="45" font-size="13" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Run commands</text>
  <text x="430" y="62" font-size="10" fill="#374151" text-anchor="middle">bash · PowerShell</text>

  <rect x="520" y="20" width="140" height="60" rx="8" fill="#eef6ff" stroke="#0a6fe7" stroke-width="1.5"/>
  <text x="590" y="45" font-size="13" font-weight="bold" fill="#0a6fe7" text-anchor="middle">Drive tools</text>
  <text x="590" y="62" font-size="10" fill="#374151" text-anchor="middle">MCP · browser · Jupyter</text>

  <!-- Arrows from cards to core -->
  <line x1="110" y1="80" x2="350" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="270" y1="80" x2="365" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="430" y1="80" x2="395" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="590" y1="80" x2="410" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Providers row -->
  <text x="380" y="220" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">provider-agnostic routing</text>
  <rect x="60" y="240" width="110" height="36" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="115" y="262" font-size="11" fill="#374151" text-anchor="middle">OpenAPI</text>
  <rect x="190" y="240" width="110" height="36" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="245" y="262" font-size="11" fill="#374151" text-anchor="middle">Gemini</text>
  <rect x="320" y="240" width="110" height="36" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="375" y="262" font-size="11" fill="#374151" text-anchor="middle">Bedrock/Vertex</text>
  <rect x="450" y="240" width="110" height="36" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="505" y="262" font-size="11" fill="#374151" text-anchor="middle">FuXi OAuth</text>
  <rect x="580" y="240" width="120" height="36" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="640" y="262" font-size="11" fill="#374151" text-anchor="middle">+ any OpenAI-compatible</text>

  <line x1="380" y1="180" x2="380" y2="238" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr3)"/>
</svg>
